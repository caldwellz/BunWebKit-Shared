name: Build WebKit (Reusable)

env:
  LLVM_VERSION: 19

on:
  workflow_call:
    inputs:
      build_ref:
        description: 'Git ref to build (commit SHA, branch, or tag)'
        type: string
        required: true
      release_tag:
        description: 'Full release tag (including autobuild- prefix)'
        type: string
        required: true
      is_prerelease:
        description: 'Mark release as prerelease'
        type: boolean
        default: false
      llvm_version:
        description: 'LLVM version to use'
        type: string
        default: '19'
    outputs:
      release_tag:
        description: 'The release tag that was created'
        value: ${{ jobs.release.outputs.tag }}

jobs:
  linux:
    name: Linux
    runs-on: ${{matrix.os}}
    strategy:
      matrix:
        include:
          - label: bun-webkit-linux-amd64
            os: ubuntu-latest
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Release"
            DEFAULT_CFLAGS: "-march=x86-64-v3 -fcf-protection=full -fstack-protector-strong"
            LTO_FLAG: "-flto=thin"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - label: bun-webkit-linux-amd64-debug
            os: ubuntu-latest
            package_json_arch: "x64"
            CMAKE_BUILD_TYPE: "Debug"
            DEFAULT_CFLAGS: "-march=x86-64-v3 -fcf-protection=full -fstack-protector-strong"
            RELEASE_FLAGS: "-Og -g -mno-omit-leaf-frame-pointer -fno-omit-frame-pointer -ffunction-sections -fdata-sections -faddrsig -fno-unwind-tables -fno-asynchronous-unwind-tables"
          - label: bun-webkit-linux-arm64
            os: ubuntu-24.04-arm
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Release"
            DEFAULT_CFLAGS: "-march=armv8-a -mbranch-protection=standard -fstack-protector-strong"
            LTO_FLAG: "-flto=thin"
            RELEASE_FLAGS: "-O3 -DNDEBUG=1"
          - label: bun-webkit-linux-arm64-debug
            os: ubuntu-24.04-arm
            package_json_arch: "arm64"
            CMAKE_BUILD_TYPE: "Debug"
            DEFAULT_CFLAGS: "-march=armv8-a -mbranch-protection=standard -fstack-protector-strong"
            RELEASE_FLAGS: "-Og -g -mno-omit-leaf-frame-pointer -fno-omit-frame-pointer -ffunction-sections -fdata-sections -faddrsig -fno-unwind-tables -fno-asynchronous-unwind-tables"
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - uses: docker/setup-buildx-action@v2
        id: buildx
        with:
          install: true
      - name: Run
        env:
          RELEASE_FLAGS: ${{matrix.RELEASE_FLAGS}}
          ENABLE_SANITIZERS: ${{matrix.ENABLE_SANITIZERS}}
        run: |
          rm -rf ${{runner.temp}}/bun-webkit ${{runner.temp}}/bun-webkit.tar.gz
          WEBKIT_RELEASE_TYPE=${{matrix.CMAKE_BUILD_TYPE}} LTO_FLAG="${{matrix.LTO_FLAG}}" LLVM_VERSION=${{env.LLVM_VERSION}} DEFAULT_CFLAGS="${{matrix.DEFAULT_CFLAGS}}" RELEASE_FLAGS="${{matrix.RELEASE_FLAGS}}" temp=${{runner.temp}} ENABLE_SANITIZERS="${{matrix.ENABLE_SANITIZERS}}" bash release.sh
          cd ${{runner.temp}}
          echo "#define BUN_WEBKIT_VERSION \"${{ inputs.build_ref }}\"" >> bun-webkit/include/cmakeconfig.h
          echo '{ "name": "${{matrix.label}}", "version": "0.0.1-${{ inputs.build_ref }}", "os": ["linux"], "cpu": ["${{matrix.package_json_arch}}"], "repository": "https://github.com/${{github.repository}}" }' > bun-webkit/package.json
          tar -czf bun-webkit.tar.gz bun-webkit
          rm -rf bun-webkit
      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.label}}
          path: ${{runner.temp}}/bun-webkit.tar.gz

  windows:
    strategy:
      matrix:
        include:
          - runner: windows
            build-type: Release
            package_json_arch: "x64"
            label: bun-webkit-windows-amd64
            platform: x64
          - runner: windows
            build-type: Debug
            package_json_arch: "x64"
            label: bun-webkit-windows-amd64-debug
            platform: x64
          - runner: windows-11-arm
            build-type: Release
            package_json_arch: "arm64"
            label: bun-webkit-windows-arm64
            platform: ARM64
          - runner: windows-11-arm
            build-type: Debug
            package_json_arch: "arm64"
            label: bun-webkit-windows-arm64-debug
            platform: ARM64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Install Scoop
        run: |
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod -Uri https://get.scoop.sh | Invoke-Expression
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $Env:GITHUB_PATH
      - name: Install LLVM and Ninja (x64)
        if: matrix.platform == 'x64'
        # Downloads from 7-zip.org fail with SSL errors on GHA runners.
        # Use the pre-installed 7zip on Windows runners instead.
        run: |
          "C:\Program Files\7-Zip" >> $Env:GITHUB_PATH
          scoop config use_external_7zip true
          scoop install ninja llvm@19.1.7
          Join-Path (Resolve-Path ~).Path "scoop\apps\llvm\current\bin" >> $Env:GITHUB_PATH
      - name: Install LLVM and Ninja (ARM64)
        if: matrix.platform == 'ARM64'
        run: |
          "C:\Program Files\7-Zip" >> $Env:GITHUB_PATH
          scoop config use_external_7zip true
          scoop install ninja
          # Install LLVM ARM64 from official LLVM releases
          # Use LLVM 21 for ARM64 - has better Windows ARM64 support and fixes SEH unwind bugs
          $llvmVersion = "21.1.8"
          $llvmUrl = "https://github.com/llvm/llvm-project/releases/download/llvmorg-$llvmVersion/LLVM-$llvmVersion-woa64.exe"
          $llvmPath = "C:\LLVM"
          Invoke-WebRequest -Uri $llvmUrl -OutFile "$env:TEMP\llvm-arm64.exe"
          & "C:\Program Files\7-Zip\7z.exe" x "$env:TEMP\llvm-arm64.exe" -o"$llvmPath" -y
          "$llvmPath\bin" >> $Env:GITHUB_PATH
      # Note: Cygwin is no longer needed - ICU is now built with MSBuild
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.build_ref }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !LayoutTests/
            !JSTests/
      - name: Build WebKit
        run: |
          if ("${{matrix.platform}}" -eq "ARM64") {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\arm64\;" + $env:Path
          } else {
            $env:Path = "C:\Program Files (x86)\Windows Kits\10\bin\10.0.22621.0\x64\;" + $env:Path
          }
          $env:WEBKIT_OUTPUT_DIR = "bun-webkit"
          $env:BUN_WEBKIT_VERSION = "${{ inputs.build_ref }}"
          $env:CMAKE_BUILD_TYPE = "${{matrix.build-type}}"
          $env:PACKAGE_JSON_LABEL = "${{matrix.label}}"
          $env:GITHUB_SHA = "${{ inputs.build_ref }}"
          $env:PACKAGE_JSON_ARCH = "${{matrix.package_json_arch}}"
          $env:GITHUB_REPOSITORY = "${{ github.repository }}"
          ./windows-release.ps1 -Platform ${{matrix.platform}}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{matrix.label}}
          path: bun-webkit.tar.gz

  release:
    name: release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - linux
    #  - macos
      - windows
    #  - linux-musl
    outputs:
      tag: ${{ steps.release_info.outputs.tag }}
    steps:
      - run: uname -a
      - run: free
      - run: env
      - run: mount
      - run: lscpu
      - run: lsmem
      - run: lsblk
      - run: lspci
      - run: lsipc
      - run: whoami
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-linux-amd64
          path: ${{runner.temp}}/bun-webkit-linux-amd64
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-linux-arm64
          path: ${{runner.temp}}/bun-webkit-linux-arm64
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-linux-amd64-debug
          path: ${{runner.temp}}/bun-webkit-linux-amd64-debug
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-linux-arm64-debug
          path: ${{runner.temp}}/bun-webkit-linux-arm64-debug
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-windows-amd64
          path: ${{runner.temp}}/bun-webkit-windows-amd64
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-windows-amd64-debug
          path: ${{runner.temp}}/bun-webkit-windows-amd64-debug
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-windows-arm64
          path: ${{runner.temp}}/bun-webkit-windows-arm64
      - uses: actions/download-artifact@v4
        with:
          name: bun-webkit-windows-arm64-debug
          path: ${{runner.temp}}/bun-webkit-windows-arm64-debug

      - name: Rename files
        run: |
          mkdir -p out
          mv ${{runner.temp}}/bun-webkit-linux-amd64/bun-webkit.tar.gz ./out/bun-webkit-linux-amd64.tar.gz
          mv ${{runner.temp}}/bun-webkit-linux-arm64/bun-webkit.tar.gz ./out/bun-webkit-linux-arm64.tar.gz
          mv ${{runner.temp}}/bun-webkit-linux-amd64-debug/bun-webkit.tar.gz ./out/bun-webkit-linux-amd64-debug.tar.gz
          mv ${{runner.temp}}/bun-webkit-linux-arm64-debug/bun-webkit.tar.gz ./out/bun-webkit-linux-arm64-debug.tar.gz
          mv ${{runner.temp}}/bun-webkit-windows-amd64/bun-webkit.tar.gz ./out/bun-webkit-windows-amd64.tar.gz
          mv ${{runner.temp}}/bun-webkit-windows-arm64/bun-webkit.tar.gz ./out/bun-webkit-windows-arm64.tar.gz
          mv ${{runner.temp}}/bun-webkit-windows-amd64-debug/bun-webkit.tar.gz ./out/bun-webkit-windows-amd64-debug.tar.gz
          mv ${{runner.temp}}/bun-webkit-windows-arm64-debug/bun-webkit.tar.gz ./out/bun-webkit-windows-arm64-debug.tar.gz

      - name: Set release info
        id: release_info
        run: |
          echo "tag=${{ inputs.release_tag }}" >> $GITHUB_OUTPUT

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.is_prerelease }}

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            ./out/bun-webkit-linux-amd64.tar.gz
            ./out/bun-webkit-linux-arm64.tar.gz
            ./out/bun-webkit-linux-amd64-debug.tar.gz
            ./out/bun-webkit-linux-arm64-debug.tar.gz

      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            ./out/bun-webkit-windows-amd64.tar.gz
            ./out/bun-webkit-windows-amd64-debug.tar.gz
            ./out/bun-webkit-windows-arm64.tar.gz
            ./out/bun-webkit-windows-arm64-debug.tar.gz
